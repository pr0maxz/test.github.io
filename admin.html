<!DOCTYPE html>
<html lang="th">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>ProMaxz | CMS Backstage</title>
 <link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32">
 <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700;900&display=swap" rel="stylesheet">
 <style>
 /* ใช้ตัวแปรสีและธีมเดียวกับเว็บหลัก 100% */
 :root {
 --bg-void: #020202; --bg-panel: rgba(10, 10, 10, 0.7);
 --cyber-red: #FF003C; --cyber-red-dim: rgba(255, 0, 60, 0.2);
 --text-glow: #ffffff; --text-dim: #888888; --font-main: 'Prompt', sans-serif;
 }
 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body {
 background-color: var(--bg-void); color: var(--text-glow);
 font-family: var(--font-main); line-height: 1.6;
 background-image: radial-gradient(circle at 50% 0%, #3a0008 0%, var(--bg-void) 60%);
 background-attachment: fixed;
 }
 .sys-header {
 font-size: 2rem; color: #fff; margin-bottom: 30px;
 text-shadow: 0 0 10px var(--cyber-red); border-bottom: 1px solid var(--cyber-red-dim);
 padding-bottom: 10px; display: inline-block;
 }
 .sys-header::before { content: '>> '; color: var(--cyber-red); }
 .cyber-btn {
 display: inline-block; padding: 10px 20px; background: var(--cyber-red);
 color: #fff; font-weight: 700; font-size: 0.9rem; text-transform: uppercase;
 cursor: pointer; border: none;
 clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
 transition: 0.3s;
 }
 .cyber-btn:hover { background: #fff; color: var(--cyber-red); box-shadow: 0 0 15px var(--cyber-red); }
 .cyber-btn-outline {
 background: rgba(255, 0, 60, 0.1); color: var(--cyber-red); border: 1px solid var(--cyber-red);
 }
 .cyber-btn-outline:hover { background: var(--cyber-red); color: #fff; }
 
 /* สไตล์เฉพาะหน้า Admin */
 .admin-wrapper { max-width: 900px; margin: 50px auto; padding: 20px; display: none; }
 .admin-panel {
 background: var(--bg-panel); border: 1px solid var(--cyber-red);
 padding: 25px; margin-bottom: 30px; border-radius: 4px; backdrop-filter: blur(5px);
 }
 .admin-input {
 width: 100%; background: #000; border: 1px solid var(--cyber-red-dim);
 color: #fff; padding: 12px; margin-bottom: 15px; font-family: var(--font-main); outline: none;
 }
 .admin-input:focus { border-color: var(--cyber-red); }
 .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
 .flex-row > * { flex: 1; min-width: 200px; }

 /* หน้าจอล็อกอิน */
 #login-screen {
 height: 100vh; display: flex; flex-direction: column; 
 justify-content: center; align-items: center; text-align: center;
 }
 </style>
</head>
<body>

 <!-- 1. หน้าจอล็อกอิน -->
 <div id="login-screen">
    <h2 class="sys-header" style="font-size: 2.5rem;">SYSTEM_OVERRIDE</h2>
    <p style="color: var(--text-dim); margin-bottom: 20px; letter-spacing: 2px;">ENTER ACCESS CODE</p>
    
    <input type="password" id="passCode" class="admin-input" style="max-width: 300px; text-align: center; letter-spacing: 5px;">
    
    <!-- เพิ่มจุดโชว์สถานะตรงนี้ -->
    <div id="authStatus" style="font-family: monospace; font-size: 0.85rem; color: var(--cyber-red); margin: 15px 0; min-height: 20px;"></div>
    
    <button id="authBtn" class="cyber-btn" onclick="checkPassword()">AUTHORIZE</button>
 </div>

 <!-- 2. แผงควบคุม (จะโชว์เมื่อรหัสถูก) -->
 <div id="admin-dashboard" class="admin-wrapper">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
 <h1 class="sys-header" style="margin: 0;">CMS_Pr0Maxz</h1>
 <button class="cyber-btn cyber-btn-outline" onclick="location.reload()" style="border-color: #fff; color: #fff;">LOGOUT</button>
 </div>

 <!-- จัดการทัวร์ -->
 <div class="admin-panel">
 <h3 style="color: var(--cyber-red); margin-bottom: 20px;">[+] TARGET_COORDINATES (TOUR)</h3>
 <div class="flex-row">
 <input type="text" id="evDate" class="admin-input" placeholder="DATE (ex. 15 MAR)">
 <input type="text" id="evTitle" class="admin-input" placeholder="EVENT TITLE" style="flex: 2;">
 </div>
 <div class="flex-row">
 <input type="text" id="evLoc" class="admin-input" placeholder="LOCATION">
 <input type="text" id="evLink" class="admin-input" placeholder="TICKET LINK (URL)">
 </div>
 <button class="cyber-btn cyber-btn-outline" onclick="addTour()">DEPLOY EVENT</button>
 </div>

 <!-- จัดการข่าว -->
 <div class="admin-panel">
 <h3 style="color: var(--cyber-red); margin-bottom: 20px;">[+] SYSTEM_LOGS (NEWS)</h3>
 <div class="flex-row">
 <input type="text" id="nLogId" class="admin-input" placeholder="LOG_ID (ex. #0002)">
 <input type="text" id="nTitle" class="admin-input" placeholder="NEWS TITLE" style="flex: 2;">
 </div>
 <textarea id="nDesc" class="admin-input" placeholder="SHORT DESCRIPTION" rows="3"></textarea>
 <input type="text" id="nImg" class="admin-input" placeholder="IMAGE PATH (ex. assets/news2.png)">
 <button class="cyber-btn cyber-btn-outline" onclick="addNews()">PUBLISH LOG</button>
 </div>
 <!-- ========================================= -->
 <!-- แผงจัดการห้องแชท (เพิ่มใหม่ตรงนี้) -->
 <div class="admin-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="color: var(--cyber-red); margin: 0;">[+] NEXUS_COMM (CHAT LOGS)</h3>
        <button class="cyber-btn cyber-btn-outline" onclick="loadAdminChat()" style="padding: 5px 15px; font-size: 0.75rem;">REFRESH</button>
    </div>
    
    <!-- กล่องแสดงข้อความแชท -->
    <div id="admin-chat-container" style="max-height: 350px; overflow-y: auto; background: #000; padding: 15px; border: 1px solid var(--cyber-red-dim); font-family: monospace; font-size: 0.9rem; color: #fff;">
        > WAITING FOR AUTHORIZATION...
    </div>
 </div>
 <!-- ========================================= -->
 </div>
    <script>
    let currentAdminPass = "";
    
    // 1. ระบบเช็ครหัสผ่าน
    async function checkPassword() {
        const pass = document.getElementById('passCode').value;
        const btn = document.getElementById('authBtn');
        const statusText = document.getElementById('authStatus');

        if (!pass) return;

        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;
        statusText.style.color = "#fff";
        statusText.innerText = "> VERIFYING ENCRYPTION KEY...";

        try {
            const response = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pass: pass })
            });

            const result = await response.json();

            if (result.success) {
                statusText.style.color = "#0f0"; 
                statusText.innerText = "> ACCESS GRANTED. WELCOME ADMIN.";
                currentAdminPass = pass; 
                
                loadAdminChat(); // โหลดแชททันทีที่ล็อกอินผ่าน
                
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'block';
                }, 1000);
            } else {
                throw new Error("ACCESS DENIED");
            }
        } catch (error) {
            statusText.style.color = "#FF003C";
            statusText.innerText = "> ERROR: INTRUDER DETECTED. ACCESS DENIED.";
            document.getElementById('passCode').value = '';
            btn.innerText = "AUTHORIZE";
            btn.disabled = false;
        }
    }

    // 2. ระบบเพิ่มตารางทัวร์
    async function addTour() {
        const date = document.getElementById('evDate').value;
        const title = document.getElementById('evTitle').value;
        const loc = document.getElementById('evLoc').value;
        const link = document.getElementById('evLink').value;

        if(!date || !title || !loc) return alert("> ERROR: MISSING CRITICAL DATA");

        try {
            const res = await fetch('/api/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: date, title: title, location: loc, link: link, adminPass: currentAdminPass })
            });
            const result = await res.json();
            
            if(result.error) alert("> ERROR: " + result.error);
            else {
                alert("> SUCCESS: อัปเดตคิวงานขึ้นหน้าเว็บเรียบร้อย!");
                document.getElementById('evDate').value = '';
                document.getElementById('evTitle').value = '';
                document.getElementById('evLoc').value = '';
                document.getElementById('evLink').value = '';
            }
        } catch (e) {
            alert("> ERROR: SYSTEM_ERROR");
        }
    }

    // 3. ระบบเพิ่มข่าวสาร
    async function addNews() {
        const logId = document.getElementById('nLogId').value;
        const title = document.getElementById('nTitle').value;
        const desc = document.getElementById('nDesc').value;
        const img = document.getElementById('nImg').value;

        if(!logId || !title) return alert("> ERROR: MISSING LOG ID OR TITLE");

        try {
            const res = await fetch('/api/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ log_id: logId, title: title, description: desc, img_url: img, adminPass: currentAdminPass })
            });
            const result = await res.json();
            
            if(result.error) alert("> ERROR: " + result.error);
            else {
                alert("> SUCCESS: เผยแพร่ข่าวสารเรียบร้อย!");
                document.getElementById('nLogId').value = '';
                document.getElementById('nTitle').value = '';
                document.getElementById('nDesc').value = '';
                document.getElementById('nImg').value = '';
            }
        } catch (e) {
            alert("> ERROR: SYSTEM_ERROR");
        }
    }

    // 4. ระบบจัดการแชท
    async function loadAdminChat() {
        const container = document.getElementById('admin-chat-container');
        container.innerHTML = "> FETCHING CHAT LOGS...";
        try {
            const res = await fetch('/api/chat');
            const data = await res.json();
            
            if (data && data.length > 0) {
                container.innerHTML = data.map(msg => {
                    const date = new Date(msg.timestamp);
                    const timeStr = date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                    
                    return `
                    <div style="margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1; padding-right: 15px; word-break: break-word;">
                            <span style="color:#888; font-size: 0.75rem;">[${timeStr}]</span> 
                            <strong style="color: #FF003C;">${msg.name}:</strong> 
                            <span>${msg.message}</span>
                        </div>
                        <button onclick="deleteAdminMsg(${msg.id})" style="background: #8b0000; color: #fff; border: 1px solid #FF003C; padding: 5px 10px; cursor: pointer; font-weight: bold; font-family: monospace; transition: 0.3s;" onmouseover="this.style.background='#FF003C'" onmouseout="this.style.background='#8b0000'">DEL</button>
                    </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = "> NO MESSAGES FOUND IN DATABANK.";
            }
        } catch (e) {
            container.innerHTML = "> ERROR: DATABANK OFFLINE";
        }
    }

    async function deleteAdminMsg(id) {
        if (!confirm("> WARNING: CONFIRM DELETE THIS MESSAGE?")) return;
        
        try {
            const res = await fetch('/api/chat', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, adminPass: currentAdminPass })
            });
            const result = await res.json();
            
            if (result.error) alert("> ERROR: " + result.error);
            else loadAdminChat();
        } catch (e) {
            alert("> ERROR: SYSTEM_ERROR");
        }
    }
    </script>
</body>
</html>
